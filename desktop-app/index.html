<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js; connect-src 'self' https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js;"
    />
    <meta
      http-equiv="X-Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js; connect-src 'self' https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js;"
    />
    <link rel="stylesheet" href="styles.css"/>
  </head>
  <body id="mainBackground">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
    <div class="nav-bar">
      <button id="dateBackBtn" class="nav-btn">&#8592; Back</button>
      
      <p id="currentDayText" class="middle-text">App Title / Status</p>
      
      <button id="dateForwardBtn" class="nav-btn">Forward &#8594;</button>
    </div>
    <div class="top-bar-check">
      <button id="basicDBButton" type="button">Push me for DB shenanigan!</button>
      <div class="check-box-div">
        <input type="checkbox" id="show-day-ends" name="show-day-ends" value="show-day-ends" checked>
        <label for="show-day-ends">Show start and end day idle time?</label><br>
      </div>
    </div>
      
    <p id="databaseOutputText">Loading...</p>

    <canvas id="pie-chart" class="my-chart"></canvas>
    
    
    <canvas id="bar-chart" class="my-chart"></canvas>

    <script src="./renderer.js"></script>
  </body>
</html>
